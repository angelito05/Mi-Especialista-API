{% extends 'base.html' %}
{% block content %}
<h2>Mensajes</h2>
<div class="row mt-4">
    <div class="col-md-4">
        <div class="card p-3">
            <h5>Nuevo Mensaje</h5>
            <form action="{{ url_for('crear_mensaje') }}" method="POST">
                <div class="mb-2"><label>ID Solicitud</label><input type="number" name="solicitud_id" class="form-control"></div>
                <div class="mb-2"><label>ID Emisor</label><input type="number" name="emisor_id" class="form-control"></div>
                <div class="mb-2"><label>ID Receptor</label><input type="number" name="receptor_id" class="form-control"></div>
                <div class="mb-2"><label>Tipo</label><input type="text" name="tipo" class="form-control"></div>
                <div class="mb-2"><label>Contenido</label><textarea name="contenido" class="form-control"></textarea></div>
                <div class="mb-2"><label>URL Archivo</label><input type="text" name="archivo_url" class="form-control"></div>
                <div class="mb-2 form-check"><input type="checkbox" name="leido" class="form-check-input" id="leidoCheck"><label class="form-check-label" for="leidoCheck">Leído</label></div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Guardar</button>
            </form>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card p-3">
            <table class="table table-dark table-striped">
                <thead><tr><th>ID</th><th>Emisor</th><th>Receptor</th><th>Tipo</th><th>Leído</th><th>Acciones</th></tr></thead>
                <tbody>
                    {% for item in lista %}
                    <tr>
                        <td>{{ item.mensaje_id }}</td>
                        <td>{{ item.emisor_id }}</td>
                        <td>{{ item.receptor_id }}</td>
                        <td>{{ item.tipo }}</td>
                        <td>{{ 'Sí' if item.leido else 'No' }}</td>
                        <td><a href="{{ url_for('eliminar_mensaje', id=item.mensaje_id) }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar?')">Eliminar</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
