{% extends 'base.html' %}
{% block content %}
<h2>Registros</h2>
<div class="row mt-4">
    <div class="col-md-4">
        <div class="card p-3">
            <h5>Nuevo Registro</h5>
            <form action="{{ url_for('crear_registro') }}" method="POST">
                <div class="mb-2"><label>Título</label><input type="text" name="titulo" class="form-control" required></div>
                <div class="mb-2"><label>Descripción</label><textarea name="descripcion" class="form-control"></textarea></div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Guardar</button>
            </form>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card p-3">
            <table class="table table-dark table-striped">
                <thead><tr><th>ID</th><th>Título</th><th>Descripción</th><th>Acciones</th></tr></thead>
                <tbody>
                    {% for item in lista %}
                    <tr>
                        <td>{{ item.id }}</td>
                        <td>{{ item.titulo }}</td>
                        <td>{{ item.descripcion }}</td>
                        <td><a href="{{ url_for('eliminar_registro', id=item.id) }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar?')">Eliminar</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
