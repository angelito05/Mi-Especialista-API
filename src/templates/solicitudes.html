{% extends 'base.html' %}
{% block content %}
<h2>Solicitudes</h2>
<div class="row mt-4">
    <div class="col-md-4">
        <div class="card p-3">
            <h5>Nueva Solicitud</h5>
            <form action="{{ url_for('crear_solicitud') }}" method="POST">
                <div class="mb-2"><label>Título</label><input type="text" name="titulo" class="form-control" required></div>
                <div class="mb-2"><label>Descripción</label><textarea name="descripcion" class="form-control"></textarea></div>
                <div class="mb-2"><label>Dirección</label><textarea name="direccion" class="form-control"></textarea></div>
                <div class="mb-2"><label>Fecha Servicio</label><input type="date" name="fecha_servicio" class="form-control"></div>
                <div class="mb-2"><label>Hora Servicio</label><input type="time" name="hora_servicio" class="form-control"></div>
                <div class="mb-2"><label>Estado</label><input type="text" name="estado" class="form-control"></div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Guardar</button>
            </form>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card p-3">
            <table class="table table-dark table-striped">
                <thead><tr><th>ID</th><th>Título</th><th>Fecha Servicio</th><th>Hora</th><th>Estado</th><th>Acciones</th></tr></thead>
                <tbody>
                    {% for item in lista %}
                    <tr>
                        <td>{{ item.solicitud_id }}</td>
                        <td>{{ item.titulo }}</td>
                        <td>{{ item.fecha_servicio }}</td>
                        <td>{{ item.hora_servicio }}</td>
                        <td>{{ item.estado }}</td>
                        <td><a href="{{ url_for('eliminar_solicitud', id=item.solicitud_id) }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar?')">Eliminar</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
