{% extends 'base.html' %}
{% block content %}
<h2>Categorías</h2>
<div class="row mt-4">
    <div class="col-md-4">
        <div class="card p-3">
            <h5>Nueva Categoría</h5>
            <form action="{{ url_for('crear_categoria') }}" method="POST">
                <div class="mb-2"><label>Nombre</label><input type="text" name="nombre" class="form-control" required></div>
                <div class="mb-2"><label>Descripción</label><textarea name="descripcion" class="form-control" rows="2"></textarea></div>
                <div class="mb-2"><label>Ícono</label><input type="text" name="icono" class="form-control"></div>
                <div class="mb-2 form-check"><input type="checkbox" name="activo" class="form-check-input" id="act" checked><label class="form-check-label" for="act">Activo</label></div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Guardar</button>
            </form>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card p-3">
            <table class="table table-dark table-striped">
                <thead><tr><th>ID</th><th>Nombre</th><th>Descripción</th><th>Ícono</th><th>Activo</th><th>Acciones</th></tr></thead>
                <tbody>
                    {% for item in lista %}
                    <tr>
                        <td>{{ item.categoria_id }}</td>
                        <td>{{ item.nombre }}</td>
                        <td>{{ item.descripcion }}</td>
                        <td>{{ item.icono }}</td>
                        <td>{{ 'Sí' if item.activo else 'No' }}</td>
                        <td><a href="{{ url_for('eliminar_categoria', id=item.categoria_id) }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar?')">Eliminar</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
