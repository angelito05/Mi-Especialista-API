{% extends 'base.html' %}
{% block content %}
<h2>Incidencias</h2>
<div class="row mt-4">
    <div class="col-md-4">
        <div class="card p-3">
            <h5>Nueva Incidencia</h5>
            <form action="{{ url_for('crear_incidencia') }}" method="POST">
                <div class="mb-2"><label>ID Usuario</label><input type="number" name="usuario_id" class="form-control"></div>
                <div class="mb-2"><label>ID Solicitud</label><input type="number" name="solicitud_id" class="form-control"></div>
                <div class="mb-2"><label>ID Soporte</label><input type="number" name="soporte_id" class="form-control"></div>
                <div class="mb-2"><label>Tipo</label><input type="text" name="tipo" class="form-control"></div>
                <div class="mb-2"><label>Descripción</label><textarea name="descripcion" class="form-control"></textarea></div>
                <div class="mb-2"><label>Estado</label><input type="text" name="estado" class="form-control"></div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Guardar</button>
            </form>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card p-3">
            <table class="table table-dark table-striped">
                <thead><tr><th>ID</th><th>Usuario</th><th>Solicitud</th><th>Tipo</th><th>Estado</th><th>Acciones</th></tr></thead>
                <tbody>
                    {% for item in lista %}
                    <tr>
                        <td>{{ item.incidencia_id }}</td>
                        <td>{{ item.usuario_id }}</td>
                        <td>{{ item.solicitud_id }}</td>
                        <td>{{ item.tipo }}</td>
                        <td>{{ item.estado }}</td>
                        <td><a href="{{ url_for('eliminar_incidencia', id=item.incidencia_id) }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar?')">Eliminar</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
