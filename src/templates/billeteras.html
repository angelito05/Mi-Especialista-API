{% extends 'base.html' %}
{% block content %}
<h2>Billeteras</h2>
<div class="row mt-4">
    <div class="col-md-4">
        <div class="card p-3">
            <h5>Nueva Billetera</h5>
            <form action="{{ url_for('crear_billetera') }}" method="POST">
                <div class="mb-2"><label>ID Usuario</label><input type="number" name="usuario_id" class="form-control" required></div>
                <div class="mb-2"><label>Saldo</label><input type="number" step="0.01" name="saldo" class="form-control"></div>
                <div class="mb-2"><label>Moneda</label><input type="text" name="moneda" value="USD" class="form-control"></div>
                <div class="mb-2"><label>Estado</label><input type="text" name="estado" value="activo" class="form-control"></div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Guardar</button>
            </form>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card p-3">
            <table class="table table-dark table-striped">
                <thead><tr><th>ID</th><th>Usuario</th><th>Saldo</th><th>Moneda</th><th>Estado</th><th>Acciones</th></tr></thead>
                <tbody>
                    {% for item in lista %}
                    <tr>
                        <td>{{ item.billetera_id }}</td>
                        <td>{{ item.usuario_id }}</td>
                        <td>${{ item.saldo }}</td>
                        <td>{{ item.moneda }}</td>
                        <td>{{ item.estado }}</td>
                        <td><a href="{{ url_for('eliminar_billetera', id=item.billetera_id) }}" class="btn btn-danger btn-sm" onclick="return confirm('¿Eliminar?')">Eliminar</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
